#   uv run python scripts/build_spoken_squad.py --config configs/spoken_squad_dev.yaml
# ${LSR_DATA} defaults to data/datasets. Optional: articles: "0,10,11"
json: ${LSR_DATA}/spoken_squad/spoken_test-v1.1.json
wav_dir: ${LSR_DATA}/spoken_squad/dev_wav
out_dir: data/builds/spoken_squad/dev
