# First single-GPU try: three Spoken-SQuAD dev articles, original TTS voice vs.
# one male and one female Seed-VC conversion, ASR cascade vs. clean text.
#
#   uv run python scripts/download_spoken_squad.py
#   uv run python scripts/smoke_spoken_squad.py --config configs/smoke_spoken_squad.yaml
#
# ${LSR_DATA} defaults to data/datasets.
json: ${LSR_DATA}/spoken_squad/spoken_test-v1.1.json

# Same articles in every condition. 0, 10 and 11 are the ones the earlier
# voice-conversion runs covered (ParaSpeechRAG configs/perturb/speaker.yaml).
articles: [0, 10, 11]

conditions:
  original: ${LSR_DATA}/spoken_squad/dev_wav
  # LibriSpeech speakers, genders from SPEAKERS.TXT: 2803 M, 3081 F.
  # Seed-VC output, produced out of tree; copy it in from lab150 if absent.
  male_2803: ${LSR_DATA}/spoken_squad_seed-vc/2803-154320-0012
  female_3081: ${LSR_DATA}/spoken_squad_seed-vc/3081-166546-0023

build_root: data/builds/spoken_squad_smoke

text_encoder: BAAI/bge-base-en-v1.5
query_prefix: "Represent this sentence for searching relevant passages: "
asr: openai/whisper-large-v3-turbo
asr_batch_size: 8

windows:
  - {window_s: 30}
  - {window_s: 30, hop_s: 15}
min_overlap_s: 5.0
seed: 0
